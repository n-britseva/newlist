<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e1e2f, #2b2b45);
    }

    .calculator {
      width: 320px;
      background: #23233a;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .display {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: right;
      overflow: hidden;
    }

    .display .expression {
      min-height: 20px;
      font-size: 14px;
      color: #8888aa;
      word-wrap: break-word;
    }

    .display .result {
      min-height: 40px;
      font-size: 32px;
      color: #ffffff;
      word-wrap: break-word;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 18px 0;
      font-size: 18px;
      cursor: pointer;
      background: #2f2f4a;
      color: #fff;
      transition: transform 0.05s ease, filter 0.15s ease;
    }

    button:hover {
      filter: brightness(1.2);
    }

    button:active {
      transform: scale(0.95);
    }

    .operator {
      background: #ff9500;
    }

    .function {
      background: #a5a5b5;
      color: #1a1a2e;
    }

    .equals {
      background: #34c759;
      grid-column: span 2;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression">&nbsp;</div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys">
      <button class="function" data-action="clear">AC</button>
      <button class="function" data-action="backspace">⌫</button>
      <button class="function" data-action="percent">%</button>
      <button class="operator" data-op="/">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-op="*">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-op="-">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-op="+">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="dot">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </div>

  <script>
    (function () {
      const expressionEl = document.getElementById("expression");
      const resultEl = document.getElementById("result");

      let current = "0";   // текущее вводимое число
      let previous = null; // предыдущее число
      let operator = null; // выбранный оператор
      let justEvaluated = false;

      const OP_SYMBOLS = { "+": "+", "-": "−", "*": "×", "/": "÷" };

      function formatNumber(value) {
        if (value === null || value === undefined || value === "") return "";
        const num = Number(value);
        if (!isFinite(num)) return "Ошибка";
        // Ограничиваем длину, убираем лишние нули после запятой
        let str = String(Math.round(num * 1e12) / 1e12);
        return str;
      }

      function updateDisplay() {
        resultEl.textContent = current;
        if (previous !== null && operator !== null) {
          expressionEl.textContent =
            formatNumber(previous) + " " + OP_SYMBOLS[operator];
        } else {
          expressionEl.innerHTML = "&nbsp;";
        }
      }

      function inputDigit(digit) {
        if (justEvaluated) {
          current = digit;
          justEvaluated = false;
          return;
        }
        if (current === "0" && digit !== ".") {
          current = digit;
        } else if (current.replace(/[^0-9]/g, "").length < 15) {
          current += digit;
        }
      }

      function inputDot() {
        if (justEvaluated) {
          current = "0.";
          justEvaluated = false;
          return;
        }
        if (!current.includes(".")) {
          current += ".";
        }
      }

      function chooseOperator(op) {
        if (operator !== null && previous !== null && !justEvaluated) {
          calculate();
        }
        previous = Number(current);
        operator = op;
        current = "0";
        justEvaluated = false;
      }

      function calculate() {
        if (previous === null || operator === null) return;
        const a = previous;
        const b = Number(current);
        let res;
        switch (operator) {
          case "+": res = a + b; break;
          case "-": res = a - b; break;
          case "*": res = a * b; break;
          case "/":
            if (b === 0) {
              current = "Ошибка";
              previous = null;
              operator = null;
              justEvaluated = true;
              return;
            }
            res = a / b;
            break;
        }
        current = formatNumber(res);
        previous = null;
        operator = null;
        justEvaluated = true;
      }

      function percent() {
        current = formatNumber(Number(current) / 100);
      }

      function backspace() {
        if (justEvaluated || current === "Ошибка") {
          clear();
          return;
        }
        current = current.slice(0, -1);
        if (current === "" || current === "-") current = "0";
      }

      function clear() {
        current = "0";
        previous = null;
        operator = null;
        justEvaluated = false;
      }

      // Обработка кликов по кнопкам
      document.querySelector(".keys").addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;

        if (btn.dataset.digit !== undefined) {
          inputDigit(btn.dataset.digit);
        } else if (btn.dataset.op !== undefined) {
          chooseOperator(btn.dataset.op);
        } else {
          switch (btn.dataset.action) {
            case "dot": inputDot(); break;
            case "equals": calculate(); break;
            case "clear": clear(); break;
            case "backspace": backspace(); break;
            case "percent": percent(); break;
          }
        }
        updateDisplay();
      });

      // Поддержка клавиатуры
      document.addEventListener("keydown", (e) => {
        const key = e.key;
        if (/^[0-9]$/.test(key)) {
          inputDigit(key);
        } else if (key === "." || key === ",") {
          inputDot();
        } else if (["+", "-", "*", "/"].includes(key)) {
          chooseOperator(key);
        } else if (key === "Enter" || key === "=") {
          e.preventDefault();
          calculate();
        } else if (key === "Backspace") {
          backspace();
        } else if (key === "Escape") {
          clear();
        } else if (key === "%") {
          percent();
        } else {
          return;
        }
        updateDisplay();
      });

      updateDisplay();
    })();
  </script>
</body>
</html>
