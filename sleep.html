<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор цвета радуги</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.5s ease;
        }

        h1 {
            color: #333;
        }

        .rainbow-picker {
            display: flex;
            gap: 12px;
            margin: 24px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .color-swatch {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .color-swatch:hover {
            transform: scale(1.15);
        }

        .color-swatch.selected {
            border-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transform: scale(1.2);
        }

        #result {
            font-size: 1.2em;
            color: #333;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <h1>Выберите цвет радуги</h1>
    <div class="rainbow-picker" id="picker"></div>
    <p id="result">Цвет не выбран</p>

    <script src="sleep.js"></script>
</body>
</html>
